# Production overlay for Compose v2.24+. Keep compose.yaml as the local
# Phase 6A verification configuration. Secrets are supplied at runtime.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  backend:
    environment:
      GITSCOPE_ENV: production
      GITSCOPE_CORS_ORIGINS: ""
    ports: !reset []

  frontend:
    environment:
      GITSCOPE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL}
      GITSCOPE_SITE_URL: ${GITSCOPE_SITE_URL:?Set GITSCOPE_SITE_URL}
      GITSCOPE_API_BASE_URL: http://backend:5000
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Set AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?Set AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:?Set AUTH0_CLIENT_SECRET}
      AUTH0_SECRET: ${AUTH0_SECRET:?Set AUTH0_SECRET}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
