# Production overlay for Compose v2.24.4+. Keep compose.yaml as the local
# Phase 6A verification configuration. Secrets are supplied at runtime.
services:
  postgres: !reset null

  backend:
    environment:
      GITSCOPE_ENV: production
      GITSCOPE_CORS_ORIGINS: ""
    ports: !reset []

  frontend:
    environment:
      GITSCOPE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL}
      GITSCOPE_SITE_URL: ${GITSCOPE_SITE_URL:?Set GITSCOPE_SITE_URL}
      GITSCOPE_API_BASE_URL: http://backend:5000
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Set AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?Set AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:?Set AUTH0_CLIENT_SECRET}
      AUTH0_SECRET: ${AUTH0_SECRET:?Set AUTH0_SECRET}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      GITSCOPE_DB_POOL_MAX: ${GITSCOPE_DB_POOL_MAX:-5}
      GITSCOPE_DB_CONNECTION_TIMEOUT_MS: ${GITSCOPE_DB_CONNECTION_TIMEOUT_MS:-5000}
    depends_on:
      !override
      backend:
        condition: service_healthy

  migrator:
    profiles: ["release"]
    build:
      context: ./frontend
      target: migrator
    environment:
      GITSCOPE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-}
    restart: "no"

volumes:
  postgres_data: !reset null
