# Production overlay for Compose v2.24.4+. Keep compose.yaml as the local
# Phase 6A verification configuration. Secrets are supplied at runtime.
services:
  postgres: !reset null

  backend:
    environment:
      GITSCOPE_ENV: production
      GITSCOPE_CORS_ORIGINS: ""
      GITSCOPE_GITHUB_MAX_PAGES: ${GITSCOPE_GITHUB_MAX_PAGES:-10}
      GITSCOPE_GITHUB_MAX_FILE_FETCHES: ${GITSCOPE_GITHUB_MAX_FILE_FETCHES:-100}
      GITSCOPE_ANALYSIS_TIMEOUT_SECONDS: ${GITSCOPE_ANALYSIS_TIMEOUT_SECONDS:-45}
      GITSCOPE_RATE_LIMIT_DATABASE_URL: ${GITSCOPE_RATE_LIMIT_DATABASE_URL:?Set GITSCOPE_RATE_LIMIT_DATABASE_URL}
      GITSCOPE_GITHUB_METADATA_GLOBAL_LIMIT_PER_MINUTE: ${GITSCOPE_GITHUB_METADATA_GLOBAL_LIMIT_PER_MINUTE:-60}
      GITSCOPE_GITHUB_UPSTREAM_BUDGET_PER_HOUR: ${GITSCOPE_GITHUB_UPSTREAM_BUDGET_PER_HOUR:?Set GITSCOPE_GITHUB_UPSTREAM_BUDGET_PER_HOUR after checking the GitHub token quota}
    ports: !reset []
    stop_grace_period: 35s

  frontend:
    environment:
      GITSCOPE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL}
      GITSCOPE_SITE_URL: ${GITSCOPE_SITE_URL:?Set GITSCOPE_SITE_URL}
      GITSCOPE_API_BASE_URL: http://backend:5000
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Set AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?Set AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:?Set AUTH0_CLIENT_SECRET}
      AUTH0_SECRET: ${AUTH0_SECRET:?Set AUTH0_SECRET}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      GITSCOPE_DB_POOL_MAX: ${GITSCOPE_DB_POOL_MAX:-5}
      GITSCOPE_DB_CONNECTION_TIMEOUT_MS: ${GITSCOPE_DB_CONNECTION_TIMEOUT_MS:-5000}
    depends_on:
      !override
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  migrator:
    profiles: ["release"]
    build:
      context: ./frontend
      target: migrator
    environment:
      GITSCOPE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-}
    restart: "no"

volumes:
  postgres_data: !reset null
