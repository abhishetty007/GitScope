services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gitscope}
      POSTGRES_USER: ${POSTGRES_USER:-gitscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      PORT: 5000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITSCOPE_CORS_ORIGINS: ${GITSCOPE_CORS_ORIGINS:-}
      GITSCOPE_GITHUB_MAX_PAGES: ${GITSCOPE_GITHUB_MAX_PAGES:-10}
      GITSCOPE_GITHUB_MAX_FILE_FETCHES: ${GITSCOPE_GITHUB_MAX_FILE_FETCHES:-100}
      GITSCOPE_ANALYSIS_TIMEOUT_SECONDS: ${GITSCOPE_ANALYSIS_TIMEOUT_SECONDS:-45}
      GITSCOPE_PUBLIC_ANALYTICS_LIMIT_PER_MINUTE: ${GITSCOPE_PUBLIC_ANALYTICS_LIMIT_PER_MINUTE:-60}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 35s

  frontend:
    build:
      context: ./frontend
      args:
        GITSCOPE_SITE_URL: ${GITSCOPE_SITE_URL:-http://localhost:3000}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      GITSCOPE_SITE_URL: ${GITSCOPE_SITE_URL:-http://localhost:3000}
      GITSCOPE_API_BASE_URL: http://backend:5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-gitscope}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/${POSTGRES_DB:-gitscope}?schema=public
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_SECRET: ${AUTH0_SECRET:-}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
